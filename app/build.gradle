plugins {
    // AGP 9 内置 Kotlin 支持，不再需要 org.jetbrains.kotlin.android。
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.todo.lite'
    compileSdk 37

    defaultConfig {
        applicationId "com.todo.lite"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            // 打开 R8 代码压缩与资源裁剪，运行性能明显优于 debug 包
            minifyEnabled true
            shrinkResources true
            // 复用 debug 签名，便于直接覆盖安装到已装 debug 包的设备
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.runtime:runtime:1.9.2'
    implementation 'androidx.compose.foundation:foundation:1.9.2'
    implementation 'androidx.compose.ui:ui:1.9.2'
    implementation 'androidx.compose.animation:animation:1.9.2'
    implementation 'io.github.feice11:mochi-compose:0.3.0'
    implementation 'io.github.feice11:mochi-icons:0.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
